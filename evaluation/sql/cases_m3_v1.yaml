- id: q2_loss_ratio_001
  category: q2_loss_ratio
  question: 产品 product_001 在 2026 年第二季度的已发生赔款除以按保单有效天数分摊的已赚保费，赔付率是多少？季度为 4 月 1 日（含）至 7 月 1 日（不含）。
  expected_status: success
  reference_sql: WITH covered AS (SELECT p.id,p.annual_premium,GREATEST(0,LEAST(p.end_date,DATE '2026-07-01')-GREATEST(p.start_date,DATE
    '2026-04-01')) AS days FROM policies p JOIN products d ON p.product_id=d.id WHERE d.product_code='product_001'),
    earned AS (SELECT sum(annual_premium*days/365) AS amount FROM covered), incurred AS (SELECT sum(c.claim_amount)
    AS amount FROM claims c JOIN covered p ON c.policy_id=p.id WHERE c.claim_date>=DATE '2026-04-01' AND c.claim_date<DATE
    '2026-07-01' AND c.status<>'denied') SELECT round(coalesce(incurred.amount,0)/nullif(earned.amount,0),4) AS
    incurred_loss_ratio FROM earned,incurred
  ordered: false
  tolerance: '0.0001'
  expected_result:
  - incurred_loss_ratio: '0.5392'
