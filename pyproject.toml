[project]
name = "insurance-agent-harness"
version = "0.1.0"
description = "Reproducible insurance operations and knowledge workflow harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "fastmcp>=4,<5",
  "flagembedding>=1.3,<2",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.34,<2",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymilvus>=2.6,<2.7",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqlglot>=26,<30",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
